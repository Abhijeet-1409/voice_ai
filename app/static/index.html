<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelics Voice AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">intelics <span>voice</span></div>
    <div class="status-pill idle" id="statusPill">
      <div class="dot"></div>
      <span id="statusText">Idle</span>
    </div>
  </header>

  <!-- Conversation -->
  <div class="conversation" id="conversation">
    <div class="empty-state" id="emptyState">
      <div class="big-icon">🎙</div>
      <p>Press Start Call to connect to the Intelics sales agent.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <!-- Volume visualizer -->
    <div class="viz-row">
      <div class="viz-label">mic</div>
      <div class="bars" id="bars"></div>
    </div>

    <!-- Session info -->
    <div class="session-info" id="sessionInfo">session — <span>not connected</span></div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-start" id="btnStart">Start Call</button>
      <button class="btn btn-end"   id="btnEnd" disabled>End Call</button>
    </div>
  </footer>

</div>
<script src="/static/script.js"></script>
</body>
</html>
