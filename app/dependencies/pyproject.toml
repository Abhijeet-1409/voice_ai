[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared config, logging, and infra clients for Intelics voice bot services"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pydantic-settings==2.14.2",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
]

[tool.setuptools.packages.find]
include = ["shared*"]