services:

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # Long-running infrastructure service
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_ai_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_ai}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Redis
  # Long-running infrastructure service
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice_ai_redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_password}"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-redis_password}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Database migration job
  # One-shot operation
  #
  # Run explicitly:
  # docker compose run --rm migrations
  # ─────────────────────────────────────────────
  migrations:
    image: voice_ai_migrations:latest

    build:
      context: .
      dockerfile: docker/migrations.Dockerfile

    container_name: voice_ai_migrations
    restart: "no"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      ["alembic", "upgrade", "head"]


  # ─────────────────────────────────────────────
  # RAG ingestion job
  # One-shot bootstrap operation
  #
  # Run explicitly:
  # docker compose --profile bootstrap run --rm ingest
  # ─────────────────────────────────────────────
  ingest:
    image: voice_ai_ingest:latest

    build:
      context: .
      dockerfile: docker/ingest.Dockerfile

    container_name: voice_ai_ingest
    restart: "no"

    profiles:
      - bootstrap

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models

    depends_on:
      postgres:
        condition: service_healthy

    command:
      ["python", "-m", "rag.ingest"]


  # ─────────────────────────────────────────────
  # LiveKit Agent Worker
  # Long-running application service
  # ─────────────────────────────────────────────
  worker:
    image: voice_ai_worker:latest

    build:
      context: .
      dockerfile: docker/worker.Dockerfile

    container_name: voice_ai_worker
    restart: unless-stopped

    environment:
      - AGENT_MODE=${AGENT_MODE:-dev}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/application-default-credentials.json

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models
      - ./turn_detector_models:/app/turn_detector_models
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/credentials/application_default_credentials.json:ro

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: ["sh", "-c", "python -m livekit.agents download-files && python agent_runner.py $AGENT_MODE"]


volumes:
  postgres_data:
  redis_data: