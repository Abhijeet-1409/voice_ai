services:

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_ai_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_ai}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice_ai_redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_password}"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-redis_password}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Database migrations
  # ─────────────────────────────────────────────
  migrations:
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile

    container_name: voice_ai_migrations
    restart: "no"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]


  # ─────────────────────────────────────────────
  # RAG ingestion
  # Run with:
  # docker compose --profile tools up --build ingest
  # ─────────────────────────────────────────────
  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile

    container_name: voice_ai_ingest
    restart: "no"

    profiles:
      - tools

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models

    depends_on:
      postgres:
        condition: service_healthy

      migrations:
        condition: service_completed_successfully

    command:
      [
        "python",
        "-m",
        "rag.ingest"
      ]


  # ─────────────────────────────────────────────
  # LiveKit Agent Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile

    container_name: voice_ai_worker
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrations:
        condition: service_completed_successfully

    command:
      [
        "python",
        "agent_runner.py"
      ]


volumes:
  postgres_data:
  redis_data: