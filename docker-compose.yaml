services:

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # Long-running infrastructure service
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_ai_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_ai}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Redis
  # Long-running infrastructure service
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice_ai_redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_password}"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-redis_password}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ─────────────────────────────────────────────
  # Database migration job
  # One-shot operation
  #
  # Run explicitly:
  # docker compose run --rm migrations
  # ─────────────────────────────────────────────
  migrations:
    image: voice_ai_migrations:latest

    build:
      context: .
      dockerfile: docker/migrations.Dockerfile

    container_name: voice_ai_migrations
    restart: "no"

    env_file:
      - .env

    # Use the Compose service hostname from inside the migration container.
    # The host-side DATABASE_URL in .env may use localhost.
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_ai}"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      ["alembic", "upgrade", "head"]


  # ─────────────────────────────────────────────
  # RAG ingestion job
  # One-shot bootstrap operation
  #
  # Run explicitly:
  # docker compose --profile bootstrap run --rm ingest
  # ─────────────────────────────────────────────
  ingest:
    image: voice_ai_ingest:latest

    build:
      context: .
      dockerfile: docker/ingest.Dockerfile

    container_name: voice_ai_ingest
    restart: "no"

    profiles:
      - bootstrap

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models

    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    command:
      ["python", "-m", "rag.ingest"]


  # ─────────────────────────────────────────────
  # LiveKit Agent Worker
  # Long-running application service
  # ─────────────────────────────────────────────
  worker:
    image: voice_ai_worker:latest

    build:
      context: .
      dockerfile: docker/worker.Dockerfile

    container_name: voice_ai_worker
    restart: unless-stopped

    environment:
      AGENT_MODE: ${AGENT_MODE:-dev}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/application_default_credentials.json
      PROMPT_CACHE_BASE_URL: http://prompt_cache_api:8000

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./rag_models:/app/rag_models
      - ./turn_detector_models:/app/turn_detector_models
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/credentials/application_default_credentials.json:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      prompt_cache_api:
        condition: service_healthy

    command:
      ["sh", "-c", "python -m livekit.agents download-files && python agent_runner.py $AGENT_MODE"]


  # ─────────────────────────────────────────────
  # Shared Prompt Cache Service runtime configuration
  #
  # All Prompt Cache processes use the same image but run as
  # separate containers and separate supervised processes.
  # ─────────────────────────────────────────────

  prompt_cache_api:
    image: voice_ai_prompt_cache_service:latest

    build:
      context: .
      dockerfile: docker/prompt_cache_service.Dockerfile

    container_name: voice_ai_prompt_cache_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_ai}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

    command:
      ["uvicorn", "app.services.prompt_cache_service.main:app", "--host", "0.0.0.0", "--port", "8000"]


  # ─────────────────────────────────────────────
  # Prompt Cache Celery worker
  # Consumes cache-creation jobs from Redis/Celery.
  # Gemini ADC credentials are only mounted into this process.
  # ─────────────────────────────────────────────
  prompt_cache_worker:
    image: voice_ai_prompt_cache_service:latest

    build:
      context: .
      dockerfile: docker/prompt_cache_service.Dockerfile

    container_name: voice_ai_prompt_cache_worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_ai}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/application_default_credentials.json

    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/credentials/application_default_credentials.json:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    command:
      [
        "celery",
        "-A",
        "app.services.prompt_cache_service.workers.celery_app:celery_app",
        "worker",
        "--pool=prefork",
        "--loglevel=INFO",
        "--queues=prompt-cache"
      ]


  # ─────────────────────────────────────────────
  # Prompt Cache transactional outbox publisher
  # Polls PostgreSQL and publishes job IDs to Celery.
  # ─────────────────────────────────────────────
  prompt_cache_outbox_publisher:
    image: voice_ai_prompt_cache_service:latest

    build:
      context: .
      dockerfile: docker/prompt_cache_service.Dockerfile

    container_name: voice_ai_prompt_cache_outbox_publisher
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_ai}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    command:
      [
        "python",
        "-c",
        "from app.services.prompt_cache_service.workers.outbox_publisher import main; main()"
      ]


  # ─────────────────────────────────────────────
  # Prompt Cache recovery scheduler (Celery Beat)
  # Schedules prompt_cache.recover_jobs at
  # RECOVERY_INTERVAL_SECONDS from PromptCacheSettings.
  # ─────────────────────────────────────────────
  prompt_cache_recovery:
    image: voice_ai_prompt_cache_service:latest

    build:
      context: .
      dockerfile: docker/prompt_cache_service.Dockerfile

    container_name: voice_ai_prompt_cache_recovery
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_ai}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    command:
      [
        "celery",
        "-A",
        "prompt_cache_beat:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/prompt-cache-celerybeat-schedule"
      ]


volumes:
  postgres_data:
  redis_data:
